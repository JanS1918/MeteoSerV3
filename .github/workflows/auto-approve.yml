name: Auto approve for everything

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    steps:
      - uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeteoSer - Panel Principal</title>
    <link rel="stylesheet" href="/static/css/puzzle.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f6fa;
        }
        .puzzle-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 10px;
            height: 100vh;
            width: 100vw;
            box-sizing: border-box;
            padding: 10px;
        }
        .puzzle-piece {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: box-shadow 0.2s;
        }
        .puzzle-piece:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.13);
        }
        .piece-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 0.5em;
            color: #2a3a4a;
        }
        .piece-content {
            font-size: 1em;
            color: #4a5a6a;
            text-align: center;
        }
        @media (max-width: 900px) {
            .puzzle-grid {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 1fr 1fr 1fr 1fr;
            }
        }
        @media (max-width: 600px) {
            .puzzle-grid {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(6, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="puzzle-grid">
        <div class="puzzle-piece" id="estado">
            <div class="piece-title">Estado General</div>
            <div class="piece-content" id="estado-content">Cargando...</div>
        </div>
        <div class="puzzle-piece" id="sensores">
            <div class="piece-title">Sensores</div>
            <div class="piece-content" id="sensores-content">Cargando...</div>
        </div>
        <div class="puzzle-piece" id="indices">
            <div class="piece-title">Índices Ambientales</div>
            <div class="piece-content" id="indices-content">Cargando...</div>
        </div>
        <div class="puzzle-piece" id="prediccion">
            <div class="piece-title">Predicción</div>
            <div class="piece-content" id="prediccion-content">Cargando...</div>
        </div>
        <div class="puzzle-piece" id="recomendaciones">
            <div class="piece-title">Recomendaciones</div>
            <div class="piece-content" id="recomendaciones-content">Cargando...</div>
        </div>
        <div class="puzzle-piece" id="historial">
            <div class="piece-title">Historial</div>
            <div class="piece-content" id="historial-content">Cargando...</div>
        </div>
        <div class="puzzle-piece" id="noticias">
            <div class="piece-title">Noticias</div>
            <div class="piece-content" id="noticias-content">Cargando...</div>
        </div>
        <div class="puzzle-piece" id="asistente">
            <div class="piece-title">Asistente</div>
            <div class="piece-content" id="asistente-content">Cargando...</div>
        </div>
        <div class="puzzle-piece" id="configuracion">
            <div class="piece-title">Configuración</div>
            <div class="piece-content" id="configuracion-content">Cargando...</div>
        </div>
    </div>
    <script src="/static/js/puzzle.js"></script>
</body>
</html>
